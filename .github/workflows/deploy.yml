name: Deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script_stop: true
          script: |
            set -Eeuo pipefail

            APP_DIR="/var/www/Capstone"

            cd "$APP_DIR"
            git pull --ff-only origin main

            cd "$APP_DIR/frontend"
            npm ci
            npm run build
            sudo -n systemctl restart capstone-frontend

            cd "$APP_DIR/backend"
            composer install --no-dev --prefer-dist --optimize-autoloader
            php artisan optimize:clear
            # Enable this after confirming production migrations are reviewed:
            # php artisan migrate --force
            sudo -n systemctl restart capstone-backend

            sudo -n systemctl is-active --quiet capstone-frontend
            sudo -n systemctl is-active --quiet capstone-backend
            echo "Deployment completed successfully."
